{% extends "layout.html" %}
{% block title %}Routines{% endblock %}

{% block content %}

<div class="list-group">
    <div class="list-group-item title"><h1>{{ routine.name }}</h1></div>
    {% for exercise in routine.exercises.all  %}
            <a href="{% url 'sessions:exercise_detail' exercise.id %}" class="list-group-item list-group-item-action flex-column align-items-start">
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1">{{ exercise.name }}</h5>
                </div>
            </a>
    {% empty %}
        No exercises yet.
    {% endfor %}
</div> 

<a class="my_button bottom-left"  href="{% url 'sessions:routine_list' %}">
    <i class="fas fa-arrow-left" title="routines"></i>
    <span class="icon-text">Routines</span>
</a>

{% endblock content %}
