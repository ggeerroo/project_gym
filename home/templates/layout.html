<!DOCTYPE html>
<html lang="en">

<head>
{% load static %}
{% block head %}{% endblock head %}
<title>{% block title %}{% endblock %}</title>
<!-- Required meta tags -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">


<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
<!-- Load an icon library to show a hamburger menu (bars) on small screens -->
<!-- Reference https://www.w3schools.com/howto/howto_js_topnav_responsive.asp -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
 <!-- My CSS -->
<link rel="stylesheet" href="{% static 'sessions/css/styles.css' %}">
</head>


<body>   
<div class="topnav" id="myTopnav">
  <a href="/">Home</a>
  <a href="{% url 'sessions:routine_list' %}">Routines</a>
  {% comment %} <a href="#">Exercises</a> {% endcomment %}
  <a href="{% url 'sessions:session_create' %}">NEW SESSION</a>
  <a href="javascript:void(0);" class="icon" onclick="myFunction()">
    <i class="fa fa-bars"></i>
  </a>
</div>

<div>{% block content %}{% endblock %}</div>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
<!-- My JS -->
<script src="{% static 'sessions/js/navigation.js' %}"></script>

</body>


<footer>{% block footer %}{% endblock %}</footer>


</html>
